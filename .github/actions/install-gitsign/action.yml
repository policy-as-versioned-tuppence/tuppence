name: Install pinned gitsign
description: Provision the release identity verifier outside the checkout
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITSIGN_VERSION: 0.17.1
        GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae
      run: bash "$GITHUB_ACTION_PATH/install.sh" "$GITSIGN_VERSION" "$GITSIGN_SHA256"
