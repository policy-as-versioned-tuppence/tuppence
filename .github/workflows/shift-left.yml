name: shift-left policy check

# Ticket mo-10: platform/shift-left/ci-check.py (see platform's own README)
# run for real, cross-org -- tuppence and platform checked out side by side
# in one run, TWO SEPARATE GitHub orgs, no monorepo assumption. This is the
# real shape `ci-workflow.example.yml` in the platform repo documents; this
# file is that shape actually wired into an institution's own CI, as that
# file says every institution must do for itself. Adapted from driftwood's
# copy of the same file, the first institution this was wired into.
#
# No `paths:` filter: this check must report a status on every PR (including
# a Renovate bump PR that only touches gitops/platform/platform-pin.yaml, not
# deploy/pod.yaml) -- a required check gated by `paths:` never runs on a PR
# that doesn't touch those paths, and GitHub then blocks the merge forever
# waiting on a status that was never going to arrive (the same gotcha
# faithful-floor ticket 12 hit and fixed the same way).
#
# Ticket mo-10 follow-up (2026-08-21): a green check on this job used to be
# the whole signal. That is not independently verifiable by a human reviewer
# -- it says "GitHub ran a job", not "the gate actually ran and passed". The
# steps after the gate build a small JSON attestation, sign it keyless (same
# Fulcio-from-Actions-OIDC, logged-to-Rekor pattern cut-release.yml already
# proves out for release tags) and post the signed result as a PR comment,
# so the reviewer can verify the check independently of trusting the badge.
#
# Ticket cs-28 (2026-08-23): the ADOPTER GATE. This is a SEPARATE, ADDITIONAL
# check alongside ci-check.py above (that mechanism stays -- workload-vs-
# version-window is a different question from "should this institution
# adopt this platform release at all"). Fixes the two live bugs spec.md
# names: the platform checkout below has always checked out platform's
# DEFAULT BRANCH, not the tag a Renovate bump PR actually proposes -- so
# every check that ran after it was silently checking the wrong tree on a
# bump PR. .github/scripts/adopter-gate.py:
#   1. reads gitops/platform/platform-pin.yaml from THIS PR's head (the
#      checkout below already has it) and re-checks-out `platform` at that
#      exact tag,
#   2. verifies the resolved commit against the pin's own `commit` field --
#      refuses on disagreement, making ADR-0001's belt-and-braces pin
#      load-bearing rather than decorative,
#   3. verifies platform's cs-27 evidence signature -- cosign verify-blob,
#      offline, identity-pinned to EVIDENCE_EXPECTED_IDENTITY_REGEXP below
#      (THIS institution's own constant -- platform's identity is never
#      discovered from anything platform itself supplies; a platform
#      workflow rename breaks this on purpose),
#   4. computes tuppence's own composed bump -- for the one party tuppence
#      pins (platform), this is exactly platform's own verified
#      `bump.computed`, re-read per currently-supported version, plus MAJOR
#      for any version retired between the old pin and this one. It never
#      recomputes the publisher's answer.
# A composed major is a real, non-zero-exit failure of this required check.
# Ticket cs-29 then renders that verified evidence into the pull request
# BODY ITSELF -- the literal thing the ticket's title and first acceptance-
# criterion line name (see the render step below for the splice mechanism).
#
# Cross-party composition is out of scope for this whole effort (spec.md,
# "Out of Scope"). tuppence's gitops/ pins exactly one POLICY-BEARING party
# this way (platform, via gitops/platform/platform-pin.yaml) -- the other
# GitRepository in this repo, gitops/flux-system/gotk-sync-nist.yaml, pins
# the `nist` OSCAL controls CATALOG, a regulator data feed with no
# computed-semver version array or evidence mechanism at all, so it is not
# a second party this gate composes across.

on: [pull_request]

# Extra permissions past the read-only default: the adopter-gate step
# verifies keyless (needs the OIDC issuer, though cosign verify-blob itself
# needs no ambient credential -- only signing does), the attestation step
# signs keyless via this run's own Actions identity (needs the ambient OIDC
# credential), and the comment steps post to the pull request. An explicit
# permissions block zeroes every unlisted permission rather than defaulting
# it, so every line below is a real grant, not restating what already held.
permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  # cs-28: THIS institution's own constant, verifying PLATFORM's evidence
  # signature -- a different party's identity than release.yml's own
  # EXPECTED_IDENTITY_REGEXP (which verifies TUPPENCE's own release tags).
  # Same identity cut-release.yml's own gitsign-signed tag carries (cs-27's
  # cosign sign-blob step runs inside that same run) -- literal here, never
  # read from anything platform's own repo states about itself. Anchored
  # (^...$) and every literal `.` escaped; allows platform's main branch or
  # a release/<major>.<minor>.x maintenance branch, the same backport shape
  # ticket 14 already established for release.yml. See
  # scripts/verify-identity-regexp.sh for the proof this behaves as
  # intended, including "a platform workflow rename breaks verification".
  EVIDENCE_EXPECTED_IDENTITY_REGEXP: ^https://github\.com/policy-as-versioned-platform/platform/\.github/workflows/cut-release\.yml@refs/heads/(main|release/[0-9]+\.[0-9]+\.x)$
  EXPECTED_ISSUER: https://token.actions.githubusercontent.com

jobs:
  shift-left:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: tuppence, fetch-depth: 0 }

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-platform/platform
          path: platform
          fetch-depth: 0
          fetch-tags: true
          # Live bug #1 (spec.md, "Two live bugs"): no `ref:` here means
          # this checkout is platform's DEFAULT BRANCH -- correct for a
          # normal PR (workload manifest changes, checked against whatever
          # ci-check.py's own version window resolves), but on a Renovate
          # bump PR the platform tag under review is a SEPARATE, later step
          # below: adopter-gate.py re-checks-out this SAME directory at the
          # exact tag gitops/platform/platform-pin.yaml's PR-head content
          # names, before verifying anything against it.

      - name: party artefact check (ticket 11) -- schema, pinned tags, baseline mirror
        # platform/party/party_artefact.py, called through the pinned platform
        # dependency this job already checked out above -- the same "library,
        # not a service" shape ci-check.py uses. Refuses if party.yaml is
        # structurally invalid, if a declared implementations/controls version
        # disagrees with what gitops/platform/platform-pin.yaml or
        # gitops/flux-system/gotk-sync-nist.yaml actually pin, or if
        # gitops/apps/nist-pin-configmap.yaml's baselineName disagrees with
        # party.yaml's own baseline.
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 platform/party/party_artefact.py check tuppence/party.yaml --adopter-dir tuppence

      - name: install pinned kyverno cli (binary + checksum, no marketplace action)
        env:
          KYVERNO_VERSION: 1.18.2
          KYVERNO_SHA256: cb2feb8356149fd2fe774c894ccf0969f4a60a83867dd913af724f74ffbbc18b
        run: |
          set -euo pipefail
          curl -sSL -o kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tar.gz" | sha256sum -c -
          tar xzf kyverno.tar.gz kyverno && chmod +x kyverno && sudo mv kyverno /usr/local/bin/kyverno
          pip install --quiet pyyaml

      - name: install pinned cosign (binary + checksum, no marketplace action)
        # Moved ahead of the adopter gate (was previously installed later,
        # only for the attestation step) -- cs-28's evidence verification
        # needs it too.
        env:
          COSIGN_VERSION: 3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        run: |
          set -euo pipefail
          curl -sSL -o cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          chmod +x cosign && sudo mv cosign /usr/local/bin/cosign

      - name: adopter gate -- checkout the tag under review, verify the pin, verify evidence, compose the bump (cs-28)
        id: adopter_gate
        run: |
          set -euo pipefail
          # The PR base ref's platform-pin.yaml -- "before this bump", read
          # from tuppence's own git history, never from a discovery
          # endpoint. Absent/empty -> adopter-gate.py treats it as "no
          # predecessor" (e.g. this institution's very first pin).
          old_pin=old-platform-pin.yaml
          if git -C tuppence fetch --quiet --depth 1 origin "${{ github.event.pull_request.base.sha }}" \
             && git -C tuppence show "${{ github.event.pull_request.base.sha }}:gitops/platform/platform-pin.yaml" > "$old_pin" 2>/dev/null; then
            echo "old pin (PR base) found"
          else
            : > "$old_pin"
            echo "no old pin found at the PR base -- treated as no predecessor"
          fi
          # ticket 18 / ADR-0011: --adopter-dir/--base-ref/--head-ref make
          # tuppence's own composed/evidence.json member set the subject,
          # not platform's raw distribution/versions.yaml array. --head-ref
          # is literally HEAD, not github.event.pull_request.head.sha:
          # actions/checkout on a pull_request event checks out GitHub's own
          # synthetic merge commit (refs/pull/N/merge) -- head.sha itself is
          # never fetched as a separately addressable commit, even with
          # fetch-depth: 0 (depth controls history length, not which commit
          # is checked out), so `git show <head.sha>:...` fails even though
          # the identical content sits in the working tree right now.
          python3 tuppence/.github/scripts/adopter-gate.py \
            --platform-dir platform \
            --new-pin-yaml tuppence/gitops/platform/platform-pin.yaml \
            --old-pin-yaml "$old_pin" \
            --identity-regexp "${EVIDENCE_EXPECTED_IDENTITY_REGEXP}" \
            --issuer "${EXPECTED_ISSUER}" \
            --adopter-dir tuppence \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref HEAD \
            --out adopter-summary.json

      # Ticket 43 (18 Answer 4): the per-institution matrix row is filled HERE,
      # by the adopter, with platform's PUBLISHED computed-semver package, run
      # against this institution's own claimed policy versions with its own
      # workloads added to the generated corpus. The publisher's own matrix
      # stays empty and says so -- NORTH-STAR §2 forbids platform reading this
      # repository. The row lands in composed/evidence.json; the PR carries it
      # like every other composed change, and a human merges.
      - name: fill this institution's own per-institution matrix row (ticket 43)
        run: |
          set -euo pipefail
          python3 tuppence/.github/scripts/adopter-gate.py --matrix-row \
            --platform-dir platform --adopter-dir tuppence

      - name: render the verified evidence into the pull request BODY (cs-29 -- the body itself, not a comment)
        # `if: always()` -- a REFUSAL is the most valuable output this gate
        # produces (spec.md), so the reviewer sees WHY, not just a red X.
        #
        # An earlier draft posted this as a PR COMMENT, reasoning Renovate
        # authors and can overwrite the PR body on its own re-runs -- a
        # reviewer correctly flagged that as not satisfying the ticket's own
        # title and first acceptance-criterion line ("the pull request body
        # carries the evidence document"). This now edits the body for real:
        # it fetches the PR's CURRENT body (`gh pr view --json body`, so it
        # always reads whatever Renovate most recently wrote -- this job is
        # triggered BY the pull_request event Renovate's own push raises, so
        # it never races Renovate's write), then splices the rendered
        # evidence between render-evidence-comment.py's own SECTION_START/
        # SECTION_END markers -- replacing a prior run's span in place, or
        # appending if this is the first run on this PR -- and writes the
        # result back with `gh pr edit --body-file`.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f adopter-summary.json ]; then
            echo "no adopter-summary.json -- the gate refused before producing one, nothing to render"
            exit 0
          fi
          python3 tuppence/.github/scripts/render-evidence-comment.py adopter-summary.json > evidence-raw.md
          python3 tuppence/.github/scripts/render-evidence-comment.py wrap evidence-raw.md evidence-section.md
          gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json body -q .body > current-body.md
          python3 tuppence/.github/scripts/render-evidence-comment.py splice \
            current-body.md evidence-section.md new-body.md
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file new-body.md

      - name: version cross-check gate
        run: python3 platform/shift-left/ci-check.py --resource tuppence/deploy/pod.yaml

      - name: build the shift-left attestation
        # Only reached if the gate step above exited 0 -- the attestation
        # claims "pass" because a non-zero ci-check.py already stopped the
        # job before this step runs.
        run: |
          set -euo pipefail
          printf '{\n' > attestation.json
          printf '  "pr_number": %s,\n' "${{ github.event.pull_request.number }}" >> attestation.json
          printf '  "head_sha": "%s",\n' "${{ github.event.pull_request.head.sha }}" >> attestation.json
          printf '  "gate": "shift-left",\n' >> attestation.json
          printf '  "result": "pass",\n' >> attestation.json
          printf '  "run_id": "%s",\n' "${{ github.run_id }}" >> attestation.json
          printf '  "run_url": "%s"\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> attestation.json
          printf '}\n' >> attestation.json
          cat attestation.json

      - name: sign the attestation keyless (Fulcio cert from this run's own OIDC identity, logged to Rekor)
        run: cosign sign-blob --yes --bundle attestation.cosign.bundle attestation.json

      - name: post the signed attestation as a PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### shift-left gate: signed attestation"
            echo
            echo "\`platform/shift-left/ci-check.py\` passed for this PR. The JSON below is"
            echo "signed keyless -- a Fulcio certificate bound to this run's own GitHub"
            echo "Actions OIDC identity, logged to the public Rekor transparency log -- so"
            echo "this is an independently verifiable 'this was checked' signal, not just a"
            echo "green status badge."
            echo
            echo '```json'
            cat attestation.json
            echo '```'
            echo
            echo "Signature bundle (certificate + signature + Rekor log entry -- verify with"
            echo "\`cosign verify-blob --bundle attestation.cosign.bundle ...\`):"
            echo
            echo '```json'
            cat attestation.cosign.bundle
            echo '```'
          } > pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file pr-comment.md

  compose-check:
    # Ticket 18 (policy-composition): each adopter's shift-left check
    # recomposes on every pull request -- not just a Renovate bump PR, any
    # PR, so this job also has no `paths:` filter, exactly the shift-left
    # job's own reasoning above. It regenerates the composed artefact and
    # the evidence document (ticket 12), fails on any diff against the
    # committed copies, fails on refusal, and prints the document as the
    # job summary (spec.md: "a refusal is the most valuable output the gate
    # produces").
    #
    # Three parents checked out at tuppence's own pinned tags: platform
    # (implementations + threat, same pin shift-left's own job reads), nist
    # (controls, gitops/flux-system/gotk-sync-nist.yaml), and ico (pricing --
    # no Flux/Renovate pin exists for this kind anywhere in this estate
    # today, party_artefact.py's own NOTE says so plainly, so it checks out
    # at its default branch, matching composition.py's own unpinned-parent
    # handling).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { path: tuppence }

      - name: read tuppence's own pinned platform and nist tags
        # Self-contained -- each adopter's own adopter-gate.py CLI has
        # evolved independently (ticket cs-28's own module docstring: built
        # per adopter) and their read-pin-shaped subcommands are not
        # uniform, so this reads the two GitRepository pin files directly
        # rather than depending on any adopter's own script shape.
        id: pins
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 tuppence/.github/scripts/read-two-pins.py \
            tuppence/gitops/platform/platform-pin.yaml platform \
            tuppence/gitops/flux-system/gotk-sync-nist.yaml nist \
            >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-platform/platform
          fetch-depth: 0
          path: platform
          ref: ${{ steps.pins.outputs.platform_tag }}

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-nist/nist
          fetch-depth: 0
          path: nist
          ref: ${{ steps.pins.outputs.nist_tag }}

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-ico/ico
          fetch-depth: 0
          path: ico
          ref: main

      # The two parents ticket 21 added. `party.yaml` inherits feed/threat-register
      # from `feeds` and, through the insurer's quote, from `insurer` -- but this
      # job only ever checked out platform, nist and ico, so composition had no
      # tree for either and refused:
      #     feeds/feed@v1: no parent tree provided
      #     insurer/feed@v1: no parent tree provided
      # A parent that is declared and not fetched is a refusal, which is the
      # honest outcome; the repair is to fetch it, not to stop declaring it.
      # `main` matches the ico line above: neither repo cuts a tag this adopter
      # pins yet, and when one does, this ref moves to that pin with the others.
      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-feeds/feeds
          fetch-depth: 0
          path: feeds
          ref: ecosystem/thin-slice

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-insurer/insurer
          fetch-depth: 0
          path: insurer
          ref: ecosystem/thin-slice

      - name: recompose tuppence's party artefact; fail on refusal or drift; print the document as the job summary
        run: |
          set -uo pipefail
          pip install --quiet pyyaml
          python3 platform/compose/composition.py compose tuppence --estate-clone . --out tuppence \
            2>&1 | tee compose-output.json
          status=${PIPESTATUS[0]}
          {
            echo "## composition check"
            echo
            echo '```json'
            cat compose-output.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::composition refused -- see the job summary for the full document"
            exit 1
          fi
          drift="$(git -C tuppence status --porcelain -- composed/)"
          if [ -n "$drift" ]; then
            echo "::error::the regenerated composed artefact differs from the committed copy under tuppence/composed/"
            echo "$drift"
            git -C tuppence --no-pager diff -- composed/ | head -400
            exit 1
          fi
          echo "composed artefact matches the committed copy -- no drift"
