apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-rds-multi-az-5-0-0
  labels:
    policy-as-versioned.dev/policy: cloud
    policy-as-versioned.dev/policy-version: 5.0.0
    policy-as-versioned.dev/composed-for: tuppence
    policy-as-versioned.dev/cloud-package-version: 1.0.0
  annotations:
    policies.kyverno.io/title: RDS Multi-AZ observation
    policies.kyverno.io/description: Harvested collie intent (cp-10). Audit observes
      the field; the cloud cage tightens it at restricted and below. Nothing is denied.
    policy-as-versioned.dev/inherited-from: platform@d314b8df0b19c42ea816c0a6ada41913b7940fbe
    policy-as-versioned.dev/source-path: implementations/cloud/policies/require-rds-multi-az.yaml
spec:
  validationActions:
  - Audit
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rds.aws.m.upbound.io
      apiVersions:
      - v1beta1
      operations:
      - CREATE
      - UPDATE
      resources:
      - instances
  matchConditions:
  - name: only-this-policy-version
    expression: object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('')
      == '5.0.0'
  - name: spec-change
    expression: oldObject == null || !has(oldObject.spec) || object.spec != oldObject.spec
  validations:
  - expression: object.spec.?forProvider.?multiAz.orValue(false) == true
    message: spec.forProvider.multiAz should be true (cp-10).
