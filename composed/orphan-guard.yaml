apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: policy-version-orphan-guard
  labels:
    policy-as-versioned.dev/policy: platform-machinery
    policy-as-versioned.dev/composed-for: tuppence
  annotations:
    policy-as-versioned.dev/inherited-from: platform@3.3.0
    policy-as-versioned.dev/source-path: distribution/versions.yaml (rendered from the array)
spec:
  validationActions:
  - Audit
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: has-policy-version-label
    expression: object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') != ''
  variables:
  - name: allowed
    expression: '[''4.0.0'', ''5.0.0'']'
  - name: claimed
    expression: object.metadata.labels['policy-as-versioned.dev/policy-version']
  validations:
  - expression: variables.allowed.exists(v, v == variables.claimed)
    message: 'policy-version not in the platform-declared version array (orphan): no ResourceSet element declares it, so no served policy version governs this pod -- every served cage-tier is scoped to its own version. It runs, caged on the bottom rung by policy-version-orphan-cage, and the rules it escapes are a priced hole (ADR-0026). Nothing is denied.'
