# The pre-registration for tuppence's five-fact Flux sample.
#
# Ecosystem ticket 42 (the widening of ticket 40), from ticket 16 answer items Q1, Q2, Q3 and Q5,
# under ADR-0023 decisions D1 and D3.
#
# **This file is the declaration, and its first commit is the proof it was made up front.** It is
# written and committed BEFORE `drift/five-facts.py` takes its first sample here. The ticket's own
# words: "a sample that passes with a falsifier undeclared is a fail". `verify-reconcile.sh`
# enforces exactly that -- `five-facts.py grade` re-reads this file and refuses to grade any
# sample PASS unless all three falsifier ids below are declared.
#
# Nothing here states an expected answer. Writing the conclusion into the instrument is how a
# measurement becomes a demonstration.
#
# THIS IS TUPPENCE'S OWN WINDOW. driftwood carries a window of the same shape with its own
# sources, its own pins, its own clock time and its own coverage floor, and no number is copied
# from it: an eco-system in which every org's instrument is set by one org is one org's demo.
# tuppence has no build-ticket-64 drift probe, so `drift/samples.jsonl` here carries five-fact
# records and nothing else.
schema: drift.window/v1
version: 1

five_fact_sample:
  schema: drift.five-facts/v1
  declared_on: '2026-08-29'
  ticket: ecosystem 42, widening ecosystem 40, from ticket 16 answer items Q1, Q2, Q3, Q5
  question: >-
    Is tuppence's composed policy set in force on the cluster, and did every byte of it arrive
    through a source whose signed tag was verified at the Flux source boundary? "In force" is not
    "a policy object with the right name exists": a `kubectl apply` of the same YAML would satisfy
    that weaker claim and prove nothing about reconciliation.

  # STATE continuity only. These five facts observe the STATE of a control against its
  # declaration. They do not observe whether an ACTION crossed a control; that is a different
  # claim, needs a different instrument, and no window here is open on it.
  measures: STATE continuity only.

  # One record per source, five facts per record. `null` is could-not-look and is never a pass.
  facts:
    - id: fact_1_ready_at_the_pin_on_the_real_remote
      per: source
      claim: >-
        The GitRepository is Ready=True, its spec.ref.tag and spec.ref.commit equal the pin
        checked in under gitops/, and its spec.url is the publisher's real remote
        (https://github.com/policy-as-versioned-<party>/<party>) and not an in-cluster seed.
    - id: fact_2_tag_signature_verified_at_the_source_boundary
      per: source
      claim: >-
        The source carries a verdict from the identity-pinned gitsign-verifying controller and
        that verdict is true, reached against the publisher's OWN pinned identity and the Actions
        OIDC issuer. One signature, the gitsign tag (ADR-0023, D3). A hand-applied annotation does
        not count, and a `spec.verify` OpenPGP/SSH key re-signing the ref is a second signer,
        which is graded observed FALSE and not a pass.
    - id: fact_3_last_applied_revision_equals_the_pinned_commit
      per: source
      claim: >-
        For a source a Kustomization consumes, that Kustomization's status.lastAppliedRevision
        names the pinned commit. For platform and nist, which stay VERIFIED SOURCES ONLY (ticket
        16 Q5) and have no Kustomization, the pinned commit equals the matching parent sha in
        composed/HEADER.yaml -- the revision the composed set in force was actually built from.
    - id: fact_4_rendered_objects_byte_equal_to_an_offline_render
      per: the composed set
      claim: >-
        Every object in the offline render of composed/ at the pinned ref is live on the cluster
        and equal to that render.
      ceiling: >-
        The API server fills in defaults, so a live object is never byte-identical to its source.
        The comparison is therefore: every field the offline render DECLARES is present and equal
        live. A field the render omits is not compared. Both verdicts are recorded per object --
        `declared_equal` (what the fact is graded on) and `strict_equal` (byte identity, recorded
        for the reader) -- so the weaker one is visible rather than implied.
      amended: >-
        2026-09-24, ticket 140. The ceiling above is unchanged. One absence is read as equal: a
        declared zero value on a field a built-in type tags `omitempty`, which the API server never
        writes out. Today that is PriorityClass `globalDefault: false` only, listed with its Go tag
        in scripts/render_composed.py API_OMITTED_ZERO. A declared non-zero value that is absent
        live still fails, and every object read this way is named in the sample under
        objects_read_through_omitted_zero.
    - id: fact_5_every_rendered_object_is_in_the_flux_inventory
      per: the composed set
      claim: >-
        Every such object appears in the inventory of the Flux Kustomization or ResourceSet that
        claims it. This is the fact that separates "Flux put it there" from "somebody ran kubectl
        apply", and it is the reason facts 4 and 5 are two facts and not one.

  # Q2. Declared before sample one. Each is a way this measurement can come out AGAINST the claim.
  falsifiers:
    - id: verified_source_ready_but_the_object_is_absent_or_unequal_and_unhealed
      fires_when: >-
        A source is Ready and verified while a rendered object is absent from the cluster, or live
        but unequal to the offline render, in N consecutive samples spanning more than N times the
        consuming Kustomization's own interval -- so Flux was given N full chances to heal it and
        did not.
      n: 3
      interval_source: >-
        spec.interval of the Kustomization that reconciles the object, read LIVE from the cluster
        at sample time, never a number typed here. Today that is 5m
        (gitops/flux-system/gotk-sync.yaml and the composed ResourceSet), so the heal deadline is
        15 minutes; a change to the interval moves the deadline with it and this file needs no
        edit.
      means_if_it_fires: >-
        Continuous reconciliation is not delivering tuppence's composed set. "Verified and Ready"
        is then a statement about a git object, not about the cluster, and the claim that the cage
        in git is the cage on the cluster is false.
    - id: cluster_side_verification_passes_a_tag_that_identity_pinned_ci_rejects
      fires_when: >-
        The gitsign-verifying controller of ticket 41 reports a tag's signature verified while the
        same tag, checked in CI against the pinned identity -- issuer, subject and the workflow
        that may sign -- is rejected.
      means_if_it_fires: >-
        Cluster-side verification is checking that SOMETHING signed the tag, not that the pinned
        identity did. That is a weaker property than the one D3 claims, and the source boundary is
        then not a trust boundary.
      how_it_is_looked_for: >-
        The sample records the identity the cluster verified against beside the identity CI pins.
        Where the controller has not run, the cluster verified nothing and this falsifier reads
        could-not-look -- which is not a pass, and is recorded as such in every sample.
    - id: coverage_below_the_floor_at_close_recorded_unmeasured
      fires_when: >-
        At the close of the measurement the fraction of expected samples actually taken is below
        the floor.
      # TUPPENCE'S OWN FLOOR, and deliberately not driftwood's 0.9. tuppence is the smaller
      # adopter and its clock shares an Actions quota with propose-tier and renovate-run on the
      # same hour; a floor it cannot hold is a floor that reads UNMEASURED every close and stops
      # meaning anything. 0.8 of a daily cadence over 91 days is 73 samples, still enough that a
      # month of silence cannot hide inside a pass.
      floor: 0.8
      cadence:
        every_minutes: 1440
        # Wider than driftwood's 240: a hosted runner that queues an hour behind an 08:22 cron is
        # a scheduling fact, not a coverage hole, and counting it as one would make the number
        # dishonest in the other direction.
        tolerance_minutes: 360
      means_if_it_fires: >-
        The result is UNMEASURED and is recorded as unmeasured. It is not a null result, it is not
        a pass, and it may not be quoted as either. An instrument whose silence reads as "the
        composed set was in force" is worse than no instrument.

  # Q3, under D1. The sample is an OBSERVATION, which a clock may append.
  operation:
    owner: Chris Nesbitt-Smith
    runner: >-
      .github/workflows/drift-sample.yml in this repository -- a scheduled GitHub Actions job at
      08:22 UTC, tuppence's own choice, that brings up an EPHEMERAL KinD cluster, installs Flux,
      Kyverno and flux-operator, reconciles from the REAL remotes, appends one record per source,
      and deletes the cluster. Not the local kind-tuppence cluster: that one reconciles from an
      in-cluster seeded git server (scripts/up.sh), so fact 1 is observed FALSE there by
      construction and a run against it would prove nothing about an org boundary.
    cage: >-
      The workflow's OBSERVATION_LANE is `drift/samples.jsonl` and nothing else, and its
      `observation cage` step fails the run on anything else in the index or the tree (ADR-0023,
      D1). verify/schedules/verify-schedules.sh in the hub parses that lane.
    presenter_runs: >-
      A sample taken by hand on a developer's machine is a REHEARSAL (ADR-0023, D4). It is not
      appended to this log and it is never cited. `five-facts.py grade` enforces it rather than
      asking to be trusted: the newest sample's `run` must be a GitHub Actions run id AND the
      commit that put the line in this file must be the lane's own signed commit, or the grade is
      could-not-look.

# =============================================================================
# ADDENDUM, added 2026-09-10 and REGISTERED AGAIN 2026-09-26. A THIRD instrument in this file, and
# the second one that shares `samples.jsonl`.
#
# Nothing above is changed. The window, its subjects, its drift definition, its cadence and its
# falsifiers are exactly as pre-registered, the five-fact section above is untouched, and the
# guard `drift_window_was_declared_before_it_was_measured`, which reads this file's FIRST commit
# against the samples, is unmoved by a later commit.
#
# What is declared here is the pre-registration for ecosystem ticket 86, under ticket 75 Q8 (the
# owner's answer, delegated: the lane branch): TWO MORE FACTS, taken in the same sample, on the
# same scheduled run, as the five. Ecosystem ticket 152 (delegated, 2026-09-25) registered the
# section again and ticket 161 built it: the comparison pod is a REFERENCE WORKLOAD that the cage
# does not select, fact 7 has a new id, one falsifier is renamed, one is replaced and two are added.
# The section below is the one ticket 152 drafted, byte for byte except `declared_on`.
#
# WHY THIS EXISTS. The estate's most distinctive claim is that nothing is denied -- a workload
# that does not fit its cage runs on a tighter rung, and the bottom rung runs and REACHES NOTHING.
# That claim has never been graded PASS on a citable run. The instrument that observes it,
# platform's `graded/verify-graded.sh` live tail, needs a persistent KinD cluster the scheduled
# truth runner has never created; it has exited 3 (could not look) on every run since run 15. The
# only evidence that the cage holds comes from presenter runs on a laptop, and NORTH-STAR §5
# forbids any document from citing those. This lane already brings up a real cluster per run, with
# checksum-pinned tools, reconciled from the real remotes -- so the claim is graded where a
# cluster exists.
#
# IT IS WRITTEN HERE, AND COMMITTED, BEFORE THE FIRST SAMPLE THAT SCORES IT. That is not a promise
# to take on trust: `drift/five-facts.py` reads the NEWEST commit that changed this section, from
# git, on the SERVED ref (`refs/remotes/origin/main`, first-parent), and a sample taken before that
# commit reads COULD-NOT-LOOK on both facts -- never a pass on the five it carries (ticket 152 Q4).
# A branch commit registers nothing, because a branch run records nothing (ticket 100). Rewriting
# either fact's wording after it lands re-registers it on the day of the rewrite, and every score
# taken against the old wording stops counting -- ticket 93's rule, applied one level down. The
# 2026-09-26 re-registration did exactly that: every cage score taken before it reads
# could-not-look. And a cage fact that is null on the three newest samples taken since the
# registration is a fall, not a wait (ticket 152 Q10).
cage_behaviour_sample:
  schema: drift.cage-behaviour/v2
  declared_on: '2026-09-26'
  ticket: >-
    ecosystem 152, which re-registers ecosystem 86's section (delegated, 2026-09-25). Ecosystem 86
    came from ticket 75 Q8 (owner-delegated, the lane branch).
  # Advisory only. The date the instrument actually uses is the one it reads out of git; this line
  # is here so a human reader knows what to expect to find there, and a disagreement between the
  # two is visible rather than hidden.
  question: >-
    Is the bottom rung of the cage in force a RUNNING cage rather than a refusal, and does it
    reach nothing? "Runs" is not "was admitted": a pod that is admitted and then never starts is a
    refusal with extra steps. "Reaches nothing" is not "a NetworkPolicy with an empty rule list
    exists": that is a YAML read, and this estate has already shipped a green of exactly that
    shape while a host-network pod walked out of the cage (platform/graded/verify-graded.sh,
    2026-08-28).

  measures: >-
    ADMISSION and REACH, live, on the ephemeral cluster this lane brings up. Two pods, two TCP
    connects each. It does not measure STATE continuity and does not touch the drift window above,
    whose subjects are not sampled by this run at all.

  # The experiment, declared before any of it is run.
  experiment:
    the_rung_is_the_cage_s_answer: >-
      The sampler creates two namespaces, and NEITHER names a rung. One carries
      `policy-as-versioned.dev/governed: "true"` and no tier, so the cage's own fall-closed rule
      decides where its pod lands. The instrument then checks that the landing place is the
      ladder's BOTTOM, from what the cluster serves and not from a name typed here: the pod's
      priority is the lowest of the cage PriorityClasses on the cluster, and the NetworkPolicy
      that selects it has no ingress rule and no egress rule. The other namespace carries no
      governed label and no tier, and its pod claims no policy version, so the cage does not
      select it at all (ecosystem 119, decision 2). What the cage stamped on each pod is read back
      off the pod and recorded.
    the_workload: >-
      One pod per namespace. The fall-closed pod claims the policy version whose `cage-tier`
      MutatingPolicy is newest ON THE CLUSTER -- read off the cluster, never typed, so an adopter
      whose composed array declares a different set gets its own answer with no edit here. The
      reference pod claims no version. Each pod declares `runAsNonRoot` and a numeric
      `runAsUser` in its pod security context, and `readOnlyRootFilesystem` on its container.
      What the cage writes over them is read back off the pod and recorded.
    the_probe_image: >-
      The cage injects a WAF sidecar at every hardened rung, whose image
      (`ghcr.io/acme/coraza-waf:cage`) exists in no registry: it is a placeholder for a real
      Coraza sidecar the estate does not have. Without a stand-in, every pod the cage hardens sits
      in ErrImagePull for ever and this measurement would be a measurement of a registry rather
      than of the cage. The lane therefore builds PLATFORM'S OWN stand-in --
      `graded/waf-placeholder/Dockerfile`, from platform's tree at the tag this repository pins --
      under the placeholder's own name and loads it into the node, and the same image is the
      probe's own container. Recorded on every fact that rests on it. A sidecar that sleeps is not
      a WAF: this proves the caged workload RUNS with what the cage added, never that anything
      inspected traffic.
    the_comparison: >-
      The reference workload is a second pod, in the same cluster, from the same image, running
      the same two connects, that the cage does not select. It is read before and after the
      bottom-rung pod, so a working network brackets the silence. An outage that starts after one
      working reference read and ends before the next is not observable, and the fact says so. It
      cannot be the same pod twice: in this cage the rung is a property of the NAMESPACE
      (ADR-0022) and never of the pod, because a pod that could name its own rung could exempt
      itself. It is not a pod on a rung that the sampler declares either. A Namespace created at
      run time that declared a rung would choose a cage that no signed declaration chose. Where
      that rung is looser than the adopter's own (on 2026-09-25 every adopter declared `isolated`),
      ADR-0022 calls it an exemption bought by choosing a Namespace.
    the_targets: >-
      The API server's own ClusterIP on 443, read live from the `kubernetes` Service, and
      1.1.1.1:80 as an address outside the cluster. Two ports are not a proof that nothing at all
      is reachable, and the fact says so.

  # `null` is could-not-look and is NEVER a pass, here as in the five.
  facts:
    - id: fact_6_the_bottom_rung_is_admitted_and_runs
      per: the cage in force
      claim: >-
        The workload the cage places on its own bottom rung is ADMITTED by the API server -- not
        denied, not refused by a consequence of what the cage wrote onto it -- and reaches Running
        and Ready. Observed FALSE when the create is refused (the API server's message is quoted
        verbatim, never summarised) or when the pod is admitted and never runs; observed null only
        when the cluster did not answer, when no cage is installed, or when the cluster could not
        SCHEDULE the pod, which is the runner's capacity and not the cage's doing.
    - id: fact_7_the_bottom_rung_reaches_nothing_while_the_reference_reaches
      per: the cage in force
      claim: >-
        That workload completes NEITHER a TCP connection to the API server NOR one to an address
        outside the cluster, and its rung is the ladder's bottom by its priority and by a reach
        policy with no rules. A reference workload that the cage does not select completes both.
        The reference is read before and after, so a working network brackets the silence. A
        connection, not a read of the NetworkPolicy's own YAML. Observed FALSE the moment the
        bottom-rung pod completes either connection. Observed null -- never true -- when the
        reference reached nothing either, when the cage selected the reference, when the
        fall-closed rung is not the ladder's bottom, when a connect could not be RUN at all, when
        no workload was running to measure from, or when nothing in the cage selects the
        bottom-rung pod and so nothing observed explains its silence.
      ceiling: >-
        Reach is graded on the four connection results and the reference, never on a
        NetworkPolicy. The NetworkPolicy that selects the bottom-rung pod is read for one purpose
        only: its rule count is half of the bottom check. The reference is outside the cage, so
        this fact compares the bottom rung with no cage at all. It shows that the bottom rung
        reaches nothing on a network that works. It says nothing about the rungs between.

  # Declared before sample one. Each is a way this measurement comes out against the claim, or
  # comes out unmeasured. None of them is a way it comes out quietly.
  falsifiers:
    - id: the_cage_refuses_or_never_runs_the_workload_it_caged
      fires_when: >-
        Fact 6 is observed false: the API server refuses the bottom-rung pod, or admits it and it
        never runs.
      means_if_it_fires: >-
        The estate's central claim is false as delivered on the version in force. NORTH-STAR §4
        step 4 says the workload keeps running; the owner's own words for ticket 75 Q5 are that
        something can find itself unable to run only because it does not fit the cage, never
        because it is deliberately denied. A refusal here is a denial by another name, and it is
        the composed set that produced it.
    - id: the_bottom_rung_completes_a_connection
      fires_when: >-
        The bottom-rung pod completes a TCP connection to the API server or to the address outside
        the cluster, at any point in the bounded poll.
      means_if_it_fires: >-
        The bottom rung is not a cage. "Reaches nothing" is then a statement about a YAML document
        and not about the cluster.
    - id: the_reference_reaches_nothing_either_recorded_unmeasured
      fires_when: >-
        The reference workload cannot reach the API server, or the address outside the cluster,
        either.
      means_if_it_fires: >-
        The comparison is void and the result is UNMEASURED. It is not a null result, it is not a
        pass, and it may not be quoted as either. A pod that reaches nothing because the cluster
        is broken must not read the same as a pod that reaches nothing because the cage holds --
        the same rule the probe above follows when it cannot reach its cluster.
    - id: the_cage_selects_the_reference_workload
      fires_when: >-
        The reference pod carries `posture.acme.io/tier` or `posture.acme.io/caged`, or a
        NetworkPolicy selects it.
      means_if_it_fires: >-
        The cage in force selects an unclaimed pod in an ungoverned Namespace. That reverses
        ecosystem 119 decision 2, which keeps such a pod outside the cage and prices it instead.
        The reference is then not a reference, and fact 7 is unmeasured until this section is
        registered again against the new decision.
    - id: the_fall_closed_rung_is_not_the_ladder_s_bottom
      fires_when: >-
        The fall-closed pod's priority is above the lowest value of the PriorityClasses on the
        cluster whose names start `cage-`, or the NetworkPolicy that selects it carries an ingress
        or an egress rule, or does not declare both policy types.
      means_if_it_fires: >-
        The cage falls closed to a rung that is not its bottom. The `restricted` and `quarantine`
        rungs reach neither target either, so the two connects alone cannot tell them from the
        bottom rung. Facts 6 and 7 are both unmeasured, because each names the bottom rung and a
        TRUE here would name a rung the cage did not use.
    - id: the_cage_facts_stay_unmeasured
      fires_when: >-
        Fact 6 or fact 7 is null on each of the three newest samples in `drift/samples.jsonl`
        that were taken at or after the newest registration of this section. A lane run started
        by hand from the Actions tab counts; a rehearsal is never appended (ADR-0023, D4).
      means_if_it_fires: >-
        The instrument has not looked for three samples in a row. That is a fall, not a wait:
        grade reports FAIL and names the fact and its reason. A null that clears on the next
        sample stays a could-not-look. From 2026-09-24 the cage put both of ecosystem 86's pods on
        `isolated`, fact 7 was null on every sample, and on 2026-09-25 the gate read that null as
        a declared wait. This falsifier exists so that a null which never clears is a fall.

  # Read by grade before it scores either fact.
  scoring: >-
    A sample taken before the newest commit on the served ref that changed this section reads
    could-not-look on facts 6 and 7, with a line that names that commit. The question it asks had
    not been put when the sample was taken, and a question not yet asked is never a pass. The
    five facts are scored as before.

  # Ticket 86 item 2, recorded here as well as in the hub's ADR, because a road not taken that
  # lives only in a document nobody reads beside the instrument is a road not recorded.
  road_not_taken: >-
    The alternative to this lane was an ephemeral KinD cluster on the HUB's own clock
    (.github/workflows/truth.yml), so the eleven platform live tails -- verify-graded.sh among
    them -- could run against it under a name they already look for. Ticket 75 Q8 did not take it.
    The reason is recorded in the hub's ADR: this lane already brings up exactly that cluster with
    exactly those pinned tools, and a second one would grade the same behaviour a second way while
    doubling the surface that can break; the eleven tails would also then be observing a cluster
    the hub built for them, which is a weaker claim than an adopter's own clock observing its own
    composed set. The cost of not taking it is named there too: the other ten live tails stay
    could-not-looks, and the cage is graded through the adopters and not through platform's own
    instrument.
    Two more roads were not taken when ecosystem 152 registered this section again. A reference
    pod on a looser rung that the sampler declares at run time: an exemption bought by choosing a
    Namespace (ADR-0022), in a place the binding check cannot see. And one pod read twice, with
    the generated NetworkPolicy removed between the reads: it reads a working network only after
    the silence, so it cannot bracket it (ADR-0028, decision 3), and it edits the cage under test.

  operation:
    owner: Chris Nesbitt-Smith
    runner: >-
      .github/workflows/drift-sample.yml in this repository, the same scheduled job that takes the
      five-fact sample -- one cluster, one sample, one record per source, all seven facts.
    cage: >-
      The workflow's OBSERVATION_LANE is `drift/samples.jsonl` and nothing else (ADR-0023, D1).
      This measurement creates two namespaces and two pods ON THE EPHEMERAL CLUSTER and deletes
      them again; it declares nothing in git, and the observation cage step fails the run on
      anything else in the index or the tree.
    presenter_runs: >-
      A sample taken by hand is a REHEARSAL (ADR-0023, D4). It is not appended to this log and it
      is never cited. That applies to these two facts exactly as it applies to the five, and it is
      the whole reason this section exists: the cage HAS been observed holding, many times, on a
      laptop, and none of it may be cited.
