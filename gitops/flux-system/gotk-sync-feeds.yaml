# tuppence consumes `feeds` as a PINNED, SIGNED dependency -- the same
# {tag, commit} pair shape gotk-sync-nist.yaml and gitops/platform/platform-pin.yaml
# already carry, and for the same reason (ADR-0001: post-merge tamper resistance).
#
# WHY THIS FILE EXISTS (eco-system tickets 62 and 77). Until 2026-09-04 the composing
# jobs in this repository checked feeds out at a BRANCH -- `main`, and before ticket 57
# renamed it, `ecosystem/thin-slice`, which stopped existing and killed the clock at
# fetch. A branch is not a pinned, signed dependency (NORTH-STAR section 2), and there
# was nowhere in this repository that said which version of feeds this party consumes.
# This shared source carrier includes the declared recovery-expense@v1 shadow feed.
# Its signed recovery-expense tag supplies the publisher declaration as well as the
# existing threat-register, CVE and dated FX payloads. The per-feed subscriptions in
# party.yaml remain independent; workflows read this exact source tag/commit pair.
#
# It is a VERIFIED SOURCE ONLY and gates nothing -- the same standing gotk-sync-nist.yaml
# has. Nothing in gitops/apps references it, so applying it installs no policy; it is here
# so the pin is one declared fact in one place that Renovate bumps, that the workflows
# read, and that a reader of this repository can see.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: feeds
  namespace: flux-system
  annotations:
    # Ticket 41's identity-pinned gitsign-verifying controller reads these two. Flux's own
    # spec.verify cannot verify a gitsign tag (ADR-0023 D3, fluxcd/source-controller#1068).
    # They are the constants feeds's own release.yml pins.
    policy-as-versioned.dev/gitsign-identity-regexp: ^https://github\.com/policy-as-versioned-feeds/feeds/\.github/workflows/cut-release\.yml@refs/heads/(main|release/[0-9]+\.[0-9]+\.x)$
    policy-as-versioned.dev/gitsign-issuer: https://token.actions.githubusercontent.com
  labels:
    policy-as-versioned.dev/upstream: feeds
spec:
  interval: 5m
  url: https://github.com/policy-as-versioned-feeds/feeds
  ref:
    tag: recovery-expense/v1.0.0
    commit: 9e7958e919a4a42c68f9005776bb2d922ea57d65
    # Source carrier from the genuine recovery-expense/v1.0.0 release (2026-10-23).
    # This is not a change to ordinary threat-register/CVE/FX subscriptions.
    # Renovate maintains this signed tag and full commit together, never a branch.
