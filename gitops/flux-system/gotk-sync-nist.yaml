# Pinned upstream dependency: the real `nist` 800-53 OSCAL controls catalog
# (estate/nist), consumed the same way `platform` is one level up — a signed,
# versioned artifact pinned by tag+commit, not a moving branch. A regulator
# change (nist bumps its catalog) arrives here as a reviewable PR that edits
# .spec.ref, exactly like a dependency-bump PR (see driftwood's
# scripts/bump-nist-pin.sh, same pattern reused for tuppence).
#
# On the real `policy-as-versioned-nist` GitHub remote this tag is
# gitsign-signed (keyless -> Rekor), verified out-of-band via `git verify-tag`
# / Rekor lookup (Flux's GitRepository.spec.verify only speaks OpenPGP) — same
# convention as driftwood's own gotk-sync.yaml.
#
# For the offline touring demo, scripts/up.sh rewrites .spec.url to the
# in-cluster git server (same git-server pod tuppence's own source uses —
# GIT_HTTP_EXPORT_ALL serves both bare repos) and sets the freshly-seeded
# tag+commit.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: nist
  namespace: flux-system
  annotations:
    # Ticket 41's identity-pinned gitsign-verifying controller reads these three. Flux's own
    # spec.verify cannot verify a gitsign tag (ADR-0023 D3, fluxcd/source-controller#1068), so
    # this controller verifies nist's tag; nist is a verified source only, so it gates nothing.
    # The regexp and issuer are the constants nist's own release.yml pins; the five-fact
    # sample re-reads them off the live object and grades fact 2 against them, so a boundary that
    # verified with somebody else's identity is observed false rather than merely 'verified'.
    policy-as-versioned.dev/gitsign-identity-regexp: ^https://github\.com/policy-as-versioned-nist/nist/\.github/workflows/cut-release\.yml@refs/heads/(main|release/[0-9]+\.[0-9]+\.x)$
    policy-as-versioned.dev/gitsign-issuer: https://token.actions.githubusercontent.com
  labels:
    policy-as-versioned.dev/upstream: nist
spec:
  interval: 5m
  url: https://github.com/policy-as-versioned-nist/nist
  ref:
    tag: v1.1.0
    commit: 33a05df1f5241bca6ffbc1c69a70075cdb7a5819
    # commit pinned at release (belt-and-braces immutability, ADR-0001) --
    # the resolved SHA nist's v1.0.0 tag points to, real as of ticket mo-10.
