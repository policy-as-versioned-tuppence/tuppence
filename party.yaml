# A demonstration party, not affiliated with, endorsed by or speaking for any real authority it names.
# The party artefact (policy-composition ticket 11; ADR-0012/ADR-0013).
# Same shape driftwood's copy documents in full -- see that repo's
# party.yaml for the long form. Signed under the same gitsign tag as every
# other artefact this repo publishes -- no second mechanism.
#
# 2026-08-28 (ADR-0019): the `pricing` and `threat` parent kinds became one
# `feed` kind carrying a `name` -- ico's schema is feed/penalty-schema, and
# the threat register's publisher moved from platform to the new `feeds`
# repo as feed/threat-register.
party: tuppence
# `publisher` because this party publishes something a named consumer pins: the
# exposure section in publishes[] below, which the insurer pins as a parent. ADR-0019
# point 5 makes publishes[] the discovery record, and a publishes[] record on a party
# whose roles do not say publisher is a record no resolver will look at.
roles: [risk-bearer, adopter, publisher]
reporting_currency: GBP
# Copied from platform/risk/appetite.json orgs.tuppence.tolerance.
# Ticket 144: comparable filing fixed before any price is computed; accounts/members
# are customer proxies; data_subjects was not disclosed and is omitted.
size:
  turnover: { amount: 861741000, currency: GBP }
  customers: 4900000
  headcount: 3902
  as_of: '2026-03-31'
appetite:
  # Owner-adopted 2026-10-23 assurance policy; normative GBP/year cutoffs, not calibration evidence.
  assurance_bands:
    currency: GBP
    step_up_at: 1500.0
    attest_at: 15000
    no_cage_at: 150000
  pricing_threshold: 3
  tolerance: { amount: 15000, currency: GBP }
# MODERATE: 287 controls, holds ac-6, cm-6 and ac-6.10. LOW excludes ac-6,
# one of the two controls this estate implements (ADR-0013). May add
# controls to this selection; may never remove one. Mirrored, advisory only,
# in gitops/apps/nist-pin-configmap.yaml's data.baselineName.
baseline: MODERATE
inherits:
  # Prospective 2027 shadow collection; excluded from ordinary headline pricing.
  - { party: feeds, kind: feed, name: recovery-expense, version: "v1" }
  - { party: platform, kind: implementations, version: "5.0.0", since: '2026-08-28' }
  - { party: nist,     kind: controls,        version: "1.1.0", since: '2026-08-28' }
  - { party: ico,      kind: feed, name: penalty-schema,    version: "v3", since: '2026-08-28' }
  - { party: feeds,    kind: feed, name: threat-register,   version: "v4", since: '2026-08-28' }
  # Eco-system ticket 84: the CVE feed the feeds publisher carries (cve/v2, the newest
  # directory it publishes). Priced through platform's converter as the feed's headline
  # entry. The publisher has cut no cve/vX.Y.Z tag yet, so until it does this pin is an
  # untagged pin -- a PRICED HOLE of the whole line under this party's own perspective
  # (ticket 69), never a refusal. v2 rather than v1 because two feeds of one publisher
  # at one major share a vendored directory (ticket 45 refuses that), and v2 is what a
  # subscriber joining today would pin. Renovate bumps this line when a newer major is tagged;
  # a supersede line (ticket 84) prices staying behind and the proposer opens the retirement.
  - { party: feeds,    kind: feed, name: cve,               version: "v3", since: '2026-09-08' }
overlay:
  add: []
  restate: []
  # Owner-adopted 2026-10-23: explicit supported minimum; existing Namespace isolation stays intact.
  floor: isolated
  workload_cages:
  - publisher: platform
    family: graded-enforcement
    name: cage-tier
    version: 7.0.0
    subject: tuppence/ledger
    scenario: scenarios/workload-ledger-recovery.json
    mode: recovery_planning
    why: 'Owner adopted 2026-10-23: exact declared workload recovery planning assumptions, existing accepted ordinal reduction/cost model and explicit isolated minimum. Unvalidated planning inputs only; no empirical effectiveness, calibration, response evidence or grade promotion. Overlapping counterfactual contingencies are not summed into institutional loss.'
publishes:
  # The exposure section this repository's own composition renders into
  # composed/HEADER.yaml and signs under this repository's own tag. It is a
  # SECTION of a signed artefact, not an ADR-0019 envelope of its own, so it
  # declares no payload_schema and there is no <path>/v*/feed.json to read --
  # the tag is what signs it. Declared here because ADR-0019 point 5 makes
  # publishes[] the only discovery record there is, and the insurer pins this
  # exposure as a parent; without this record its pin resolved to nothing.
  - kind: feed
    name: exposure
    path: composed
    payload_schema: null
    revoked: []

  # Ticket 144: the twin publishes its own forward scenario; tag pending owner cut.
  - kind: feed
    name: forward-intel
    path: twin/forward-intel
    payload_schema: twin/forward-intel/payload.schema.json
    revoked: []
