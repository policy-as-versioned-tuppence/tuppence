id: payment-fee-income
name: Payment fee income
kind: capability
evolution: commodity
visibility: 0.86
description: >-
  The declared cash flow. Money crosses here and nowhere else in this overlay, so this is the only
  component an impact could price through at the institution's declared pricing threshold.
  ../perspectives/tuppence.yaml records its native GBP amount derived from party.yaml turnover;
  that same-currency valuation needs no FX conversion.
