id: tuppence
name: Tuppence Bank Ltd, the employer's own seat
party: employer
pays: This institution's own balance sheet. Suppressed fee income, the incident response
  bill and the conduct regulator's penalty all land here, and this is the only seat
  this overlay carries.
values:
  payment-fee-income:
    evidence_grade: 3
    basis: Published comparable filing, grade 3, not observed here. Starling Bank
      Annual Report 2026, note7 fee income113975000GBP / statutory revenue861741000GBP;
      average employees3902; rounded accounts4900000; year end2026-03-31. Companies
      House document MzUzMDYwOTgwOGFkaXF6a2N4.
    amount: 113975000
    derived_from_party_fact: size.turnover
    share_of_turnover: 0.13226131749562803
    periods_per_year: 1
  banking-licence-standing:
    evidence_grade: 5
    basis: Asserted, not measured. No evidenced causal path runs from standing with
      the conduct regulator to fee income in this overlay, so it carries no amount
      and travels as a register entry instead.
ruin:
  cannot-settle-payments: The payments API unable to authorise or settle for a full
    business day. Ruin for this seat is not insolvency but the loss of the function
    the banking permission is held for.
cash_flow:
- payment-fee-income
note: 'The currency of these valuations is declared in ../../../currency.yaml until
  the twin''s closed `valuation` schema gains a currency field (ticket 11 answer item
  2). It is declared even though no valuation here carries an amount: the currency
  a seat would value in is a fact about the seat, not about whether a figure happens
  to exist yet.'
